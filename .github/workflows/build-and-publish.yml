name: Build & Publish
on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get Repository
        uses: actions/checkout@v4

      - name: Install Node and it's dependencies
        uses: ./.github/actions/cache-deps

      - name: Run Build
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v6
      #   with:
      #     push: true
      #     tags: ${{ secrets.DOCKER_USERNAME }}/node-practice:latest

      - name: Manually build and push Docker image
        run: |
          docker build . -t ${{ secrets.DOCKER_USERNAME }}/node-practice:latest
